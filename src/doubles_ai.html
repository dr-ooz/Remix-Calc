<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doubles AI Predictor (test)</title>
<style>
:root { --bg:#16181d; --card:#20232b; --line:#343844; --text:#e6e8ee; --dim:#9aa1b2; --ai:#5aa0ff; --foe:#ff7a6b; --ko:#3ecf8e; --pick:#2c3a2f; }
body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
h1 { font-size:20px; margin:0 0 4px; } h3 { margin:0 0 8px; font-size:15px; }
.dai-sub { color:var(--dim); margin:0 0 14px; max-width:900px; }
#dai-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
.dai-card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; border-top:3px solid var(--ai); }
.dai-card.dai-foe { border-top-color:var(--foe); }
.dai-card-title { font-weight:600; margin-bottom:6px; }
.dai-row { display:flex; align-items:center; gap:6px; margin:3px 0; }
.dai-row span { width:62px; color:var(--dim); font-size:12px; flex:none; }
.dai-row input, .dai-row select { flex:1; min-width:0; background:#111318; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 6px; }
.dai-check { display:block; margin-top:6px; font-size:12px; color:var(--dim); }
#dai-run { margin:14px 0; padding:8px 16px; background:var(--ai); color:#fff; border:0; border-radius:6px; font-weight:600; cursor:pointer; }
.dai-section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:12px; overflow-x:auto; }
.dai-table { border-collapse:collapse; width:100%; font-size:13px; }
.dai-table th, .dai-table td { border-bottom:1px solid var(--line); padding:4px 8px; text-align:left; white-space:nowrap; }
.dai-table th { color:var(--dim); font-weight:500; }
.dai-ko { color:var(--ko); font-weight:600; }
.dai-pick td { background:var(--pick); }
.dai-actions li { margin:2px 0; } .dai-note { color:var(--dim); } .dai-err { color:var(--foe); }
</style>
</head>
<body>
<h1>Doubles AI Predictor <small style="color:var(--dim);font-weight:400">(tentative test)</small></h1>
<p class="dai-sub">Shows what the doubles AI would do this turn under the two targeting ideas. Damage = max roll, 2-5 hit moves = 3 hits, always-crit moves as crits, % of the target's current HP (overkill counts). Neutral EVs/IVs for now.</p>
<div id="dai-cards"></div>
<button id="dai-run">Predict</button>
<div id="dai-out"></div>
